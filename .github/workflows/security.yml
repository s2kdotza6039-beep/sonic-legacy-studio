name: Security & RLS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      strict:
        description: "Run staging-only strict RLS/SECURITY DEFINER suite"
        required: false
        default: "false"

jobs:
  rls-and-deps:
    name: RLS access + dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://dvmftknddmssmpyhnjob.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      RLS_COVERAGE_OUT: ${{ github.workspace }}/rls-coverage.json
      STRICT_SECURITY_TESTS: ${{ (github.event.inputs.strict == 'true' || github.ref == 'refs/heads/staging') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ---- Secret scanning (gitleaks) ---------------------------------------
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

      # ---- Dependency vulns + freshness -------------------------------------
      - name: npm audit (high+)
        run: |
          set -o pipefail
          npx --yes better-npm-audit audit --level high

      - name: Dependency update report (non-blocking)
        run: |
          {
            echo "## Dependency freshness"
            echo ""
            echo '```'
            bunx --bun npm-check-updates --jsonUpgraded --dep prod,dev || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- Migration static guards ------------------------------------------
      - name: Block "WITH CHECK (true)" in migrations
        run: |
          if grep -RInE "WITH[[:space:]]+CHECK[[:space:]]*\(\s*true\s*\)" supabase/migrations \
               | grep -viE "FOR[[:space:]]+SELECT"; then
            echo "::error::A new migration adds WITH CHECK (true) on a writable policy. Scope it to auth.uid()/has_role."
            exit 1
          fi

      - name: Block r2_object_key public exposure
        run: |
          if grep -RInE "GRANT[[:space:]]+SELECT[[:space:]]*\([^)]*r2_object_key" supabase/migrations \
               | grep -viE "service_role|founder"; then
            echo "::error::A new migration re-grants r2_object_key to a public role. Keep it service_role only."
            exit 1
          fi

      # ---- RLS test suite (writes coverage JSON via reporter) ---------------
      - name: RLS access tests
        run: bunx vitest run src/test/rlsAccess.test.ts --reporter=verbose

      - name: Append RLS coverage to job summary
        if: always()
        run: bun run scripts/rls-coverage-summary.ts >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload RLS coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rls-coverage
          path: rls-coverage.json
          if-no-files-found: ignore

      # ---- Other security-adjacent tests ------------------------------------
      - name: Playback cap + resilience tests
        run: bunx vitest run src/test/playbackCap.test.ts src/test/playbackResilience.test.ts --reporter=dot

      # ---- Staging-only strict suite ----------------------------------------
      - name: Strict RLS / SECURITY DEFINER validation (staging only)
        if: env.STRICT_SECURITY_TESTS == '1'
        run: bunx vitest run src/test/rlsStrict.test.ts --reporter=verbose
